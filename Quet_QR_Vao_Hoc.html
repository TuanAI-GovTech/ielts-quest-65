<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quét Mã QR Vào Học IELTS Quest 6.5</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b1120;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #1e293b;
      padding: 36px;
      border-radius: 20px;
      border: 1px solid rgba(99, 102, 241, 0.3);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      max-width: 480px;
      width: 100%;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #fff;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      margin-bottom: 20px;
    }
    .qr-box {
      background: #fff;
      padding: 16px;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 20px;
    }
    .qr-box img {
      display: block;
      width: 220px;
      height: 220px;
    }
    .ip-badge {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid #6366f1;
      color: #818cf8;
      font-family: monospace;
      font-size: 18px;
      padding: 10px 16px;
      border-radius: 8px;
      display: block;
      margin-bottom: 16px;
      word-break: break-all;
    }
    .note {
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>📱 Dành Cho Điện Thoại &amp; iPad</h1>
    <p>Bật file <code>Chay_May_Chu_Local_Web.bat</code> trên máy tính của bố, sau đó dùng điện thoại quét mã QR bên dưới:</p>
    
    <div class="qr-box">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&amp;data=http://192.168.1.245:8080" alt="QR Code">
    </div>

    <div class="ip-badge">http://192.168.1.245:8080</div>

    <div class="note">
      ⚠️ <em>Lưu ý: Điện thoại/iPad và máy tính cần kết nối chung mạng Wi-Fi trong nhà.</em>
    </div>
  </div>
</body>
</html>
